name: Deploy to Remote Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Starting deployment..."
            
            # Navigate to project directory
            cd /root/gowritoursjava || { echo "Directory not found, cloning repository..."; cd /root && git clone https://github.com/kowshikan1986/gowritoursnew.git gowritoursjava; cd gowritoursjava; }
            
            # Pull latest changes
            echo "Pulling latest code..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # Navigate to luxury-travel-agency directory
            cd luxury-travel-agency
            
            # Install dependencies
            echo "Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Build application
            echo "Building application..."
            npm run build
            
            # Stop existing application
            echo "Stopping existing application..."
            pm2 stop luxury-travel-agency || true
            
            # Start application with PM2
            echo "Starting application..."
            pm2 start server-json.js --name luxury-travel-agency --max-memory-restart 512M
            
            # Save PM2 configuration
            pm2 save
            
            echo "Deployment completed successfully!"
