name: Deploy to Remote Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /var/www/gowritours || cd /root/gowritoursjava || { 
              echo "Directory not found, cloning repository..."
              cd /var/www && git clone https://github.com/kowshikan1986/gowritoursnew.git gowritours
              cd gowritours
            }
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # Navigate to luxury-travel-agency directory
            cd luxury-travel-agency
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps
            
            # Build application
            echo "🔨 Building application..."
            npm run build
            
            # Restart with PM2
            echo "🔄 Restarting application..."
            pm2 delete gowritours 2>/dev/null || true
            pm2 start server-production.js --name gowritours --max-memory-restart 512M
            
            # Save PM2 configuration
            pm2 save
            
            echo "✅ Deployment completed successfully!"
            pm2 status
